apis:
- name: Thru gRPC API
  description: High-performance proto3 gRPC API (with gRPC-Web for browsers) for
    the Thru blockchain. QueryService exposes 24 read operations over accounts,
    blocks, transactions, events, state proofs, and node status; CommandService
    submits transactions; StreamingService provides 8 real-time streams (blocks,
    account updates, transactions, events, height, slot metrics, node records);
    DebugService supports re-execution.
  humanURL: https://thru.org/docs/api-ref/grpc/overview/
  baseURL: https://rpc.alphanet.thru.org
  tags:
  - Blockchain
  - gRPC
  - Streaming
  properties:
  - type: APIReference
    url: https://thru.org/docs/api-ref/grpc/overview/
  - type: Protobuf
    name: QueryService
    url: grpc/unto-labs-query-service.proto
  - type: Protobuf
    name: CommandService
    url: grpc/unto-labs-command-service.proto
  - type: Protobuf
    name: StreamingService
    url: grpc/unto-labs-streaming-service.proto
  - type: Protobuf
    name: DebugService
    url: grpc/unto-labs-debug-service.proto
  - type: ErrorCatalog
    url: errors/unto-labs-error-codes.yml
- name: Thru Explorer MCP Server
  description: Official hosted Model Context Protocol server on the Thru block
    explorer. Exposes eight read-only tools (get_block, get_transaction,
    get_account, list_account_transactions, list_recent_blocks,
    list_recent_transactions, search, get_program_abi) returning LLM-oriented
    output, with an optional ?rpc= override to target other networks.
  humanURL: https://thru.org/docs/api-ref/explorer-mcp/overview/
  baseURL: https://scan.thru.org/api/mcp
  tags:
  - MCP
  - Blockchain
  - Agents
  properties:
  - type: APIReference
    url: https://thru.org/docs/api-ref/explorer-mcp/tools-reference/
  - type: MCPServer
    url: mcp/unto-labs-mcp.yml
