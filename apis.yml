aid: unto-labs
name: Unto Labs
description: 'Unto Labs is the team behind Thru, a high-performance Layer 1
  blockchain for ultra-low-latency, ultra-high-throughput applications, built
  around ThruVM — a novel virtual machine targeting the RISC-V architecture so
  programs are written in plain C rather than crypto-specific languages. Founded
  in late 2024 by Jump Crypto / Solana alums and backed by Framework Ventures
  and Electric Capital, Unto Labs publishes a public gRPC and gRPC-Web API on
  the Thru Alphanet, protobuf definitions, C/Rust/TypeScript SDKs, a first-party
  CLI, a hosted Explorer MCP server for AI agents, llms.txt documentation sets,
  and installable agent skills.'
